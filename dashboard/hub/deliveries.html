<!DOCTYPE html>
<html lang="id" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Masuk — Jastip Hub</title>
</head>
<body class="hub-body">

  <section class="hub-page-head">
    <div class="hub-page-title">
      <h1>Delivery Masuk</h1>
      <p>Pantau delivery dari pusat & laporkan penerimaan</p>
      <div class="hub-breadcrumb"><a href="../../dashboard/hub.html">Dashboard</a><span>/</span><span>Delivery Masuk</span></div>
    </div>
    <div class="hub-page-actions">
      <button class="hub-btn" id="btnExport"><i class="fa-solid fa-download"></i> Export</button>
    </div>
  </section>

  <main class="hub-main">
    <div class="hub-cards" id="statCards"></div>

    <div class="hub-panel">
      <div class="hub-panel-head">
        <h3>Semua Delivery dari Pusat</h3>
        <div class="hub-panel-tools">
          <div class="hub-search-box"><input type="search" id="dlSearch" placeholder="Cari delivery..."><i class="fa-solid fa-magnifying-glass"></i></div>
          <select class="hub-select" id="dlFilter">
            <option value="all">Semua Status</option>
            <option>Menunggu</option><option>Dikirim</option><option>Selesai</option><option>Gagal</option>
          </select>
        </div>
      </div>
      <div class="hub-table-scroll">
        <table class="hub-table">
          <thead><tr><th>Delivery ID</th><th>Order</th><th>Asal</th><th>Detail Barang</th><th>Status</th><th>ETA</th><th>Aksi</th></tr></thead>
          <tbody id="dlBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Modal Laporan Penerimaan -->
    <div class="hub-modal" id="dlModal">
      <div class="hub-modal-box">
        <div class="hub-modal-head">
          <h3 id="dlTitle">Laporan Penerimaan</h3>
          <button class="hub-modal-close" data-close>&times;</button>
        </div>
        <div class="hub-modal-body">
          <div class="hub-summary" style="margin-bottom:14px;">
            <div class="sum-icon" style="background:#EFF6FF;color:#2C7AFF;"><i class="fa-solid fa-truck"></i></div>
            <div><div class="sum-label">Delivery</div><div class="sum-value" id="dlCode">-</div></div>
          </div>

          <!-- Detail Barang -->
          <div class="hub-panel" style="margin-bottom:14px; padding:12px;">
            <div class="hub-panel-head"><h3>Detail Barang</h3></div>
            <div class="hub-table-scroll">
              <table class="hub-table">
                <thead><tr><th>Nama Barang</th><th>Jumlah</th></tr></thead>
                <tbody id="dlItems"></tbody>
              </table>
            </div>
          </div>

          <div class="hub-form-grid">
            <div class="hub-form-group">
              <label>Status Penerimaan</label>
              <select id="dlStatus">
                <option value="Diterima">Barang Diterima</option>
                <option value="Dikembalikan">Barang Dikembalikan</option>
              </select>
            </div>
            <div class="hub-form-group">
              <label>Catatan</label>
              <input type="text" id="dlNote" placeholder="cth: barang lengkap / ada yang rusak">
            </div>
          </div>
        </div>
        <div class="hub-modal-foot">
          <button class="hub-btn" data-close>Batal</button>
          <button class="hub-btn" id="btnReturDl"><i class="fa-solid fa-rotate-left"></i> Ajukan Retur</button>
          <button class="hub-btn hub-btn-solid" id="btnSaveDl"><i class="fa-solid fa-check"></i> Simpan Laporan</button>
        </div>
      </div>
    </div>
  </main>

  <script src="../../js/auth.js"></script>
  <script src="../../js/hub-layout.js"></script>
  <script>
    /* ===== DATA DELIVERY + DETAIL BARANG ===== */
    var DELIVERIES = [
      { id: 'DEL-2026-118', order: 'ORD-2026-0814-01', asal: 'Pusat Jakarta', status: 'Dalam Perjalanan', eta: 'Hari ini 15:00', items: [
        { nama: 'Beras Premium 5kg', qty: 10 },
        { nama: 'Minyak Goreng 2L', qty: 5 }
      ]},
      { id: 'DEL-2026-117', order: 'ORD-2026-0814-02', asal: 'Pusat Jakarta', status: 'Dalam Perjalanan', eta: 'Hari ini 16:00', items: [
        { nama: 'Kopi Arabika 1kg', qty: 8 },
        { nama: 'Gula Pasir 1kg', qty: 12 }
      ]},
      { id: 'DEL-2026-116', order: 'ORD-2026-0814-03', asal: 'Pusat Jakarta', status: 'Menunggu', eta: 'Besok', items: [
        { nama: 'Skincare Set Premium', qty: 3 },
        { nama: 'Parfum Premium 100ml', qty: 2 }
      ]},
      { id: 'DEL-2026-115', order: 'ORD-2026-0813-09', asal: 'Pusat Jakarta', status: 'Selesai', eta: '14 Agu 2026', items: [
        { nama: 'Beras Premium 5kg', qty: 20 }
      ]},
      { id: 'DEL-2026-114', order: 'ORD-2026-0813-08', asal: 'Pusat Jakarta', status: 'Gagal', eta: '13 Agu 2026', items: [
        { nama: 'Skincare Set Premium', qty: 3 }
      ]}
    ];

    function showToast(msg) {
      var t = document.getElementById('toast');
      if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
      t.textContent = msg; t.classList.add('show');
      clearTimeout(t._tm); t._tm = setTimeout(function () { t.classList.remove('show'); }, 2400);
    }

    function badge(s) {
      var map = { 'Selesai': 'badge-green', 'Dalam Perjalanan': 'badge-blue', 'Menunggu': 'badge-yellow', 'Gagal': 'badge-red' };
      return '<span class="badge ' + (map[s] || 'badge-gray') + '">' + s + '</span>';
    }

    function formatItems(items) {
      return items.map(function (it) { return it.nama + ' x' + it.qty; }).join(', ');
    }

    function renderStats() {
      var active = DELIVERIES.filter(function (d) { return d.status === 'Dalam Perjalanan'; }).length;
      var waiting = DELIVERIES.filter(function (d) { return d.status === 'Menunggu'; }).length;
      var el = document.getElementById('statCards');
      if (!el) return;
      el.innerHTML = [
        { icon: 'fa-solid fa-truck-fast', color: '#00AA5B', label: 'Total Delivery', value: DELIVERIES.length },
        { icon: 'fa-solid fa-shipping-fast', color: '#2C7AFF', label: 'Dalam Perjalanan', value: active },
        { icon: 'fa-solid fa-clock', color: '#F0B429', label: 'Menunggu', value: waiting },
        { icon: 'fa-solid fa-circle-check', color: '#A78BFA', label: 'Selesai', value: DELIVERIES.filter(function (d) { return d.status === 'Selesai'; }).length }
      ].map(function (c) {
        return '<div class="hub-card"><div class="hub-card-top"><span class="hub-card-label">' + c.label + '</span><div class="hub-card-icon" style="background:' + c.color + '14;color:' + c.color + ';"><i class="' + c.icon + '"></i></div></div><div class="hub-card-value">' + c.value + '</div></div>';
      }).join('');
    }

    function renderTable() {
      var search = document.getElementById('dlSearch');
      var filter = document.getElementById('dlFilter');
      var q = search ? search.value.toLowerCase() : '';
      var f = filter ? filter.value : 'all';
      var rows = DELIVERIES.filter(function (d) {
        var okS = f === 'all' || d.status === f;
        var okQ = !q || d.id.toLowerCase().indexOf(q) !== -1 || d.order.toLowerCase().indexOf(q) !== -1;
        return okS && okQ;
      });
      var body = document.getElementById('dlBody');
      if (!body) return;
      body.innerHTML = rows.length ? rows.map(function (d) {
        var aksi = (d.status === 'Dalam Perjalanan' || d.status === 'Menunggu')
          ? '<button class="hub-btn hub-btn-sm hub-btn-solid" data-report="' + d.id + '">Laporkan</button>'
          : '<span class="hint">Selesai</span>';
        return '<tr><td><strong>' + d.id + '</strong></td><td>' + d.order + '</td><td>' + d.asal + '</td><td>' + formatItems(d.items) + '</td>' +
          '<td>' + badge(d.status) + '</td><td>' + d.eta + '</td><td>' + aksi + '</td></tr>';
      }).join('') : '<tr><td colspan="7" class="hub-empty">Tidak ada data</td></tr>';
    }

    document.addEventListener('DOMContentLoaded', function () {
      renderStats(); renderTable();
      var s = document.getElementById('dlSearch'); if (s) s.addEventListener('input', renderTable);
      var f = document.getElementById('dlFilter'); if (f) f.addEventListener('change', renderTable);
      var exp = document.getElementById('btnExport'); if (exp) exp.addEventListener('click', function () { showToast('Export menyusul (Demo)'); });
      document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', function () { document.getElementById('dlModal').classList.remove('open'); }); });
      document.querySelectorAll('[data-report]').forEach(function (b) {
        b.addEventListener('click', function () {
          var id = this.getAttribute('data-report');
          var d = DELIVERIES.filter(function (x) { return x.id === id; })[0];
          if (!d) return;
          window._currentDl = d;
          document.getElementById('dlTitle').textContent = 'Laporan — ' + d.id;
          document.getElementById('dlCode').textContent = d.order;
          // Tampilkan detail barang
          var itemsBody = document.getElementById('dlItems');
          itemsBody.innerHTML = d.items.map(function (it) {
            return '<tr><td>' + it.nama + '</td><td><strong>' + it.qty + '</strong></td></tr>';
          }).join('');
          document.getElementById('dlStatus').value = 'Diterima';
          document.getElementById('dlNote').value = '';
          document.getElementById('dlModal').classList.add('open');
        });
      });
      document.getElementById('btnSaveDl').addEventListener('click', function () {
        if (!window._currentDl) return;
        var status = document.getElementById('dlStatus').value;
        var note = document.getElementById('dlNote').value.trim();
        window._currentDl.status = status === 'Diterima' ? 'Selesai' : 'Gagal';
        window._currentDl.report = status + (note ? ' (' + note + ')' : '');
        showToast(window._currentDl.id + ' — ' + status + (note ? ' (' + note + ')' : ''));
        document.getElementById('dlModal').classList.remove('open');
        renderStats(); renderTable();
      });

      // Tombol Ajukan Retur → buka halaman retur dengan referensi terisi
      var btnRetur = document.getElementById('btnReturDl');
      if (btnRetur) {
        btnRetur.addEventListener('click', function () {
          if (!window._currentDl) return;
          var ref = window._currentDl.id;
          window.location.href = 'delivery-returns.html?ref=' + encodeURIComponent(ref) + '&jenis=Delivery';
        });
      }
    });
  </script>
</body>
</html>
