<!DOCTYPE html>
<html lang="id" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, width=device-width">
  <title>Masuk — Jastip</title>
  <meta name="theme-color" content="#00AA5B">
  <link rel="icon" type="image/png" sizes="32x32" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2300AA5B'/%3E%3Ctext x='50' y='68' font-size='52' font-weight='800' font-family='Arial' fill='white' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="auth-body">

  <!-- ================= PRELOADER ================= -->
  <div id="preloader">
    <div class="preloader-logo">J</div>
  </div>

  <!-- ================= HEADER AUTH ================= -->
  <header class="auth-header">
    <a href="index.html" class="logo" aria-label="Jastip Home">
      <span class="logo-badge">J</span>
      <span class="logo-text">Jastip<span>.</span></span>
    </a>
    <a href="index.html" class="btn btn-outline"><i class="fa-solid fa-house"></i> Beranda</a>
  </header>

  <!-- ================= LOGIN FORM ================= -->
  <main class="auth-main">
    <div class="auth-card">
      <h1 class="auth-card-title">Selamat Datang di Jastip</h1>
      <p class="auth-card-sub">Silakan masuk untuk melanjutkan belanja</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Alamat Email</label>
          <div class="input-wrap">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-control with-icon" placeholder="nama@email.com" autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" class="form-control with-icon with-toggle" placeholder="Masukkan kata sandi" autocomplete="current-password">
            <button type="button" class="input-toggle" data-toggle-password="password" aria-label="Tampilkan kata sandi">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" name="remember" checked>
            Ingat saya
          </label>
          <a href="#" class="link-forgot">Lupa kata sandi?</a>
        </div>

        <button type="submit" class="btn btn-solid btn-block btn-lg">
          <i class="fa-solid fa-right-to-bracket"></i> Masuk
        </button>

        <div class="divider">atau masuk dengan</div>

        <div class="social-btns">
          <button type="button" class="btn btn-secondary" data-social-login="Google">
            <i class="fa-brands fa-google" style="color: #4285F4;"></i> Google
          </button>
          <button type="button" class="btn btn-secondary" data-social-login="Email">
            <i class="fa-solid fa-envelope" style="color: #656C7B;"></i> Email
          </button>
        </div>
      </form>

      <p class="auth-footer">
        Belum punya akun? <a href="register.html">Daftar sekarang</a>
      </p>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
